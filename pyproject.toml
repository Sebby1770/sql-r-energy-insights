[project]
name = "gridscope"
version = "0.6.1"
description = "Household energy CSV analysis engine for GridScope Studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gridscope = "gridscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
