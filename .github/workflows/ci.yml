name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python engine (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The golden parity tests run assets/analysis.js under node and skip without it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test extras
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Run pytest
        run: python -m pytest -q

      - name: Samples are reproducible
        run: make samples-check

      - name: Studio scripts parse
        run: |
          node --check assets/analysis.js
          node --check assets/studio.js

      - name: Build Python reports
        run: make demo-py demo-nem12

      - name: Build GitHub Pages site
        run: make site

      - name: Verify Python outputs
        run: |
          test -f output/py-report.html
          test -f output/py-nem12-report.html
          test -f output/tables/py_monthly_usage.csv
          test -f output/tables/py_anomalies.csv
          test -f output/tables/py_battery.csv
          test -f _site/index.html
          test -f _site/sample_nem12.csv

  analyse:
    name: R pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Run R tests
        run: make test-r

      - name: Run demo and custom pipelines
        run: make verify
