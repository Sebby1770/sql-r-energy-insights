name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test extras
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Run pytest
        run: python -m pytest -q

      - name: Build Python report
        run: make demo-py

      - name: Verify Python outputs
        run: |
          test -f output/py-report.html
          test -f output/tables/py_monthly_usage.csv
          test -f output/tables/py_anomalies.csv

  analyse:
    name: R pipeline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Run demo pipeline
        run: make demo

      - name: Run custom pipeline
        run: make custom

      - name: Verify outputs
        run: make verify
