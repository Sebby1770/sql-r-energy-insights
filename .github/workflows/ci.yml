name: CI

on:
  push:
    branches: [main, master, "fix/**", "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: R unit and SQL tests
        run: make test-r

      - name: Browser analysis tests
        run: make test-js

      - name: Run demo pipeline
        run: make demo

      - name: Run custom pipeline
        run: make custom

      - name: Verify outputs
        run: make verify

      - name: Check the sample dataset is reproducible
        run: |
          Rscript scripts/make_sample_csv.R
          git diff --exit-code data/sample_energy_upload.csv

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            output/report.html
            output/custom-report.html
          retention-days: 7
